name: Docker Hub CI - Camila (Backend Analitico)

on:
  push:
    branches:
      - develop
      - main
      - master
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - "wsgi.py"
      - ".github/workflows/dockerhub-ci.camila.yml"
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build & Push Backend Analitico (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-analitico:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-analitico:v1.0
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-analitico:${{ github.sha }}
