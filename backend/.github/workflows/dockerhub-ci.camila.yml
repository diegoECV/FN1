name: Docker Hub CI - Camila

on:
  push:
    branches:
      - develop
      - main
      - dev-2.0
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build and Push Docker Image (Camila)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_CAMILA }}
          password: ${{ secrets.DOCKERHUB_TOKEN_CAMILA }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile-camila/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_CAMILA }}/backend-transaccional:latest
            ${{ secrets.DOCKERHUB_USERNAME_CAMILA }}/backend-transaccional:v2.0
