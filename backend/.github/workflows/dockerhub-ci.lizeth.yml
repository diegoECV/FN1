name: Docker Hub CI - Lizeth

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build and Push Docker Image (Lizeth)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_LIZETH }}
          password: ${{ secrets.DOCKERHUB_TOKEN_LIZETH }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile-lizeth/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_LIZETH }}/backend-transaccional:latest
            ${{ secrets.DOCKERHUB_USERNAME_LIZETH }}/backend-transaccional:v2.0
